name: Validate generated lab

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        profile: [daily, optimized, master]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m compileall -q tools automation tests
      - run: python tools/build_lab.py --profile ${{ matrix.profile }} --baseline isis
      - run: python tools/validate_artifacts.py --profile ${{ matrix.profile }} --baseline isis
      - run: python tools/validate_documentation.py
      - run: python -m pytest -q
      - run: git diff --check
      - run: git diff --exit-code
