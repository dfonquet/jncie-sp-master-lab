<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">JNCIE-SP Logical Service and Customer Overlay</title><desc id="desc">Study overlay roles implemented with Junos logical systems, routing instances and optional lightweight endpoints.</desc>
  <defs><style>.t{font:700 38px Arial;fill:#111827}.s{font:20px Arial;fill:#475569}.h{font:700 22px Arial;fill:#334155}.nt{font:700 20px Arial;fill:#0f172a;text-anchor:middle}.ns{font:15px Arial;fill:#475569;text-anchor:middle}.pe{fill:#cffafe;stroke:#0891b2;stroke-width:3}.svc{fill:#dcfce7;stroke:#16a34a;stroke-width:3}.ext{fill:#ffedd5;stroke:#ea580c;stroke-width:3}.auto{fill:#e2e8f0;stroke:#475569;stroke-width:3}.link{stroke:#16a34a;stroke-width:3}.opt{stroke:#ea580c;stroke-width:3;stroke-dasharray:9 7}.zone{fill:none;stroke:#cbd5e1;stroke-width:2;stroke-dasharray:10 8}</style></defs>
  <rect width="1600" height="900" fill="#f8fafc"/><text class="t" x="55" y="65">Logical Service and Customer Overlay</text><text class="s" x="55" y="100">Scenario roles layered on the stable provider baseline; no advanced service is pre-solved</text>
