<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="720" viewBox="0 0 1600 720" role="img" aria-labelledby="title desc">
  <title id="title">JNCIE-SP Master Compact Logical View</title><desc id="desc">Compact logical abstraction of the master topology.</desc>
  <defs><style>.t{font:700 38px Arial;fill:#111827}.s{font:20px Arial;fill:#475569}.h{font:700 22px Arial;fill:#334155}.box{stroke-width:3;rx:18}.nt{font:700 22px Arial;fill:#0f172a;text-anchor:middle}.ns{font:16px Arial;fill:#475569;text-anchor:middle}.l{stroke:#2563eb;stroke-width:5}.d{stroke:#db2777;stroke-width:4;stroke-dasharray:10 8}.e{stroke:#0891b2;stroke-width:4}.c{stroke:#9333ea;stroke-width:4}.m{stroke:#64748b;stroke-width:3;stroke-dasharray:10 8}</style></defs>
  <rect width="1600" height="720" fill="#f8fafc"/><text class="t" x="55" y="65">Master Profile · Compact Logical View</text><text class="s" x="55" y="100">Functional abstraction for rapid orientation; use the authoritative architecture view for exact physical wiring</text>
  <rect x="55" y="155" width="230" height="95" class="box" fill="#e2e8f0" stroke="#475569"/><text class="nt" x="170" y="193">AUTO1</text><text class="ns" x="170" y="222">10.204.253.10</text><line class="m" x1="285" y1="202" x2="470" y2="202"/><rect x="470" y="168" width="220" height="68" class="box" fill="#e2e8f0" stroke="#475569"/><text class="ns" x="580" y="196">Management</text><text class="ns" x="580" y="220">10.204.253.0/24</text>
  <rect x="820" y="155" width="200" height="95" class="box" fill="#f3e8ff" stroke="#9333ea"/><text class="nt" x="920" y="193">RR1</text><text class="ns" x="920" y="222">dual attachment</text><rect x="1150" y="155" width="200" height="95" class="box" fill="#f3e8ff" stroke="#9333ea"/><text class="nt" x="1250" y="193">RR2</text><text class="ns" x="1250" y="222">dual attachment</text>
  <line class="c" x1="920" y1="250" x2="600" y2="335"/><line class="c" x1="1250" y1="250" x2="1000" y2="335"/>
  <rect x="170" y="335" width="1260" height="145" rx="28" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><text class="h" x="210" y="375">Provider core: P1-P6</text><text class="nt" x="800" y="412">Six-node IS-IS ring</text><text class="ns" x="800" y="445">normal-metric ring + three metric-20 chords · deterministic alternate paths</text>
  <line class="e" x1="300" y1="480" x2="300" y2="560"/><line class="e" x1="500" y1="480" x2="500" y2="560"/><line class="e" x1="700" y1="480" x2="700" y2="560"/><line class="e" x1="900" y1="480" x2="900" y2="560"/><line class="e" x1="1100" y1="480" x2="1100" y2="560"/><line class="e" x1="1300" y1="480" x2="1300" y2="560"/>
  <rect x="170" y="560" width="1260" height="95" rx="28" fill="#cffafe" stroke="#0891b2" stroke-width="3"/><text class="h" x="210" y="600">Provider edge: PE1-PE6</text><text class="ns" x="800" y="625">Each PE dual-homed to adjacent core nodes · service configuration intentionally left to the student</text>
  <text class="s" x="55" y="695">Blue: core abstraction · violet: RR reachability · teal: dual-homed provider edge · dashed gray: management</text>
</svg>
